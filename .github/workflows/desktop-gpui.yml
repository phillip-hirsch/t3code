name: Desktop GPUI

on:
  pull_request:
    paths: &paths
      - .github/workflows/desktop-gpui.yml
      - apps/desktop-gpui/**
      # Read by the crate: include_str! in src/ssh/tunnel.rs and the license notice in build.rs.
      - apps/server/package.json
      - native/libghostty-vt/LICENSE
  push:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: desktop-gpui-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    # Pinned rather than ubuntu-latest: the apt list below names Ubuntu 24.04 packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop-gpui
    env:
      # Debug info would roughly double the target dir on a runner with limited disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # GTK 3 and WebKitGTK 4.1 back the wry webview; xkbcommon-x11 and libxcb back GPUI's X11
      # window; EGL, GBM and PipeWire (with libclang for its bindgen) back xcap's screen capture;
      # ALSA backs rodio; fontconfig backs GPUI's text system. The secret service is pure-Rust zbus.
      - name: Install system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libasound2-dev \
            libfontconfig-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      # libghostty-vt-sys clones Ghostty and builds it with `zig build`; see vendor/README.md.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-gpui

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
