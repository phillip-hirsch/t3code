[package]
name = "t3-desktop-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "t3-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
env_logger = "0.11"
futures = "0.3"
gpui-kit = "0.9.0"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "process",
  "sync",
  "io-util",
] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
win32job = "2"
