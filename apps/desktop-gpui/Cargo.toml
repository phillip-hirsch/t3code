[package]
name = "t3-desktop-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "t3-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
env_logger = "0.11"
futures = "0.3"
getrandom = "0.3"
# The preview browser: a native WebView2 / WKWebView child of the GPUI window.
gpui-webview = "0.9.0"
# Code-block highlighting in chat markdown, for the languages agents use most.
gpui-kit = { version = "0.9.0", features = [
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-javascript",
  "tree-sitter-markdown",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
hmac = "0.12"
log = "0.4"
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "process",
  "sync",
  "io-util",
] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wry = { version = "0.53.3", package = "lb-wry", features = ["devtools"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
win32job = "2"
